name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + test + coverage)
    runs-on: ubuntu-latest
    # 集成测试用真实 Redis（@RepeatSubmit / 在线台账走真路径），H2 提供进程内数据库，
    # 因此 CI 无需 MySQL；redis 以 service container 提供，端口映射到 runner 的 6379。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: buddy
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (compile + test + coverage)
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1{m+=$8;c+=$9} END{ if(c+m>0) printf "LINE coverage: %.1f%% (%d/%d)\n", 100*c/(c+m), c, c+m; else print "no coverage data" }' "$CSV"
          else
            echo "jacoco.csv not found"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: buddy/target/site/jacoco

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buddy-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: buddy-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (vue-tsc --noEmit && vite build)
        run: npm run build

  # MySQL 一致性：真库跑 @Tag("mysql") 用例（utf8mb4 中文种子 + MyBatis 自定义 SQL 方言）。
  # 依赖 mysql/redis 两个 service container；仅在此 job 反选放开 surefire.excludedGroups。
  mysql-consistency:
    name: Backend @ MySQL (consistency)
    runs-on: ubuntu-latest
    needs: backend
    env:
      BUDDY_DB_HOST: 127.0.0.1
      BUDDY_DB_PORT: '3306'
      BUDDY_DB_NAME: buddy
      BUDDY_DB_USER: root
      BUDDY_DB_PASSWORD: root
      BUDDY_REDIS_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: buddy
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: buddy
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run MySQL-tagged integration tests (一致性 + barrier 并发 CAS)
        run: mvn -B -ntp test -Dtest=MysqlConsistencyTest,MySQLConcurrencyTest -Dsurefire.excludedGroups=

  # 前端 E2E：启动后端 jar(H2/dev) + redis，Playwright 跑真实浏览器主链路（登录/动态路由/刷新/登出）。
  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        working-directory: buddy
        run: mvn -B -ntp -DskipTests package

      - name: Start backend (dev/H2) and wait for health
        working-directory: buddy
        run: |
          nohup java -jar target/buddy.jar --spring.profiles.active=dev > backend.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:8200/api/actuator/health | grep -q '"status":"UP"'; then echo BACKEND_UP; break; fi
          done

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: buddy-ui/package-lock.json

      - name: Install deps
        working-directory: buddy-ui
        run: npm ci --legacy-peer-deps

      - name: Install Playwright chromium
        working-directory: buddy-ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: buddy-ui
        run: npm run test:e2e

  # 容器镜像构建验证（不推送）：确保两个 Dockerfile 可成功构建，产物可供部署。
  docker:
    name: Docker images (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./buddy
          push: false
          load: true
          tags: buddy-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./buddy-ui
          push: false
          load: true
          tags: buddy-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 安全扫描：硬门禁=依赖漏洞(CRITICAL、已修的不算)，secret 扫描作非阻断报表。
  # 本仓库合法包含 dev 固定口令（test/E2E/k6/README 里的 Admin@123456、application.yml 里 change-me 默认、
  # .env.example 占位），fs 扫描按字符串匹配会命中→直接红。真实密钥泄露防护应走 gitleaks pre-commit，
  # 而非拉平与真泄密一同扫到。trivy secret 扫描作为参考输出（exit-code: 0），不阻断流水线。
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vuln scan (CRITICAL · hard gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy secret scan (advisory · non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '0'
