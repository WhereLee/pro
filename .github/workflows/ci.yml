name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + test + coverage)
    runs-on: ubuntu-latest
    # 集成测试用真实 Redis（@RepeatSubmit / 在线台账走真路径），H2 提供进程内数据库，
    # 因此 CI 无需 MySQL；redis 以 service container 提供，端口映射到 runner 的 6379。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: buddy
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (compile + test + coverage)
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1{m+=$8;c+=$9} END{ if(c+m>0) printf "LINE coverage: %.1f%% (%d/%d)\n", 100*c/(c+m), c, c+m; else print "no coverage data" }' "$CSV"
          else
            echo "jacoco.csv not found"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: buddy/target/site/jacoco

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buddy-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: buddy-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (vue-tsc --noEmit && vite build)
        run: npm run build

  # MySQL 一致性：真库跑 @Tag("mysql") 用例（utf8mb4 中文种子 + MyBatis 自定义 SQL 方言）。
  # 依赖 mysql/redis 两个 service container；仅在此 job 反选放开 surefire.excludedGroups。
  mysql-consistency:
    name: Backend @ MySQL (consistency)
    runs-on: ubuntu-latest
    needs: backend
    env:
      BUDDY_DB_HOST: 127.0.0.1
      BUDDY_DB_PORT: '3306'
      BUDDY_DB_NAME: buddy
      BUDDY_DB_USER: root
      BUDDY_DB_PASSWORD: root
      BUDDY_REDIS_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: buddy
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: buddy
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run MySQL-tagged integration tests
        run: mvn -B -ntp test -Dtest=MysqlConsistencyTest -Dsurefire.excludedGroups=
