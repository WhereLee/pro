spring:
  # ---------------- 数据源：H2 内存库 ----------------
  # 使用 H2 的目的：不装任何数据库即可一键启动，方便演示与自动化测试。
  # MODE=MySQL 让 H2 尽量贴合 MySQL 语法；建表/种子由 Flyway 统一负责（db/migration）。
  # 注意：内存库进程退出即清空，仅用于开发。切换到 MySQL 见 application-mysql.yml。
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:buddy;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ''
  # 数据库初始化改由 Flyway 负责（见 application.yml 的 spring.flyway）；不再用 spring.sql.init。

  # ---------------- Redis ----------------
  data:
    redis:
      host: ${BUDDY_REDIS_HOST:localhost}
      port: ${BUDDY_REDIS_PORT:6379}
      database: 0
      timeout: 5s

# H2 控制台：启动后可访问 /api/h2-console 查看数据
h2:
  console:
    enabled: true
    path: /h2-console

# 开发环境专用的 C 端密钥（仅限 dev）：生产走环境变量注入，
# 因为 MemberTokens 对空值/短值直接拒绝启动，默认值不会泄漏到 prod。
buddy:
  member:
    jwt-secret: dev-only-member-jwt-secret-please-rotate-me-32b
    phone-pepper: dev-only-member-phone-pepper-rotate-me-32bytes
    mock-realname-auto-approve: true
    mock-sms-echo-code: true
