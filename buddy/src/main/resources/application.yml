server:
  port: 8200
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: buddy
  # ========== Flyway 数据库版本化迁移 ==========
  # 取代原 spring.sql.init(schema.sql/data.sql)：版本化、可重放、生产级 schema 演进。
  # 脚本在 classpath:db/migration（V1 建表基线、V2 种子），后续版本只增不改。
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    table: flyway_schema_history
    # 对已有数据的库首次接入打基线，避免"非空库无历史"报错；空库(dev/test)正常全量迁移
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    throw-exception-if-no-handler-found: true
  task:
    scheduling:
      # 定时任务线程池：指标采集需要短暂 sleep 做两次 CPU 采样，
      # 单线程的话会阻塞其它定时任务（如 SSE 心跳）
      pool:
        size: 5
      thread-name-prefix: buddy-sched-
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 256
      thread-name-prefix: buddy-async-

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lrs.buddy.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 打印 SQL 便于开发期排查，生产由 application-prod.yml 关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ========== 框架自定义配置 ==========
buddy:
  jwt:
    # HS256 要求密钥不少于 32 字节；生产环境务必替换并通过环境变量注入
    secret: ${BUDDY_JWT_SECRET:buddy-framework-default-secret-key-please-change-me-32bytes}
    # 令牌有效期，默认 8 小时
    expire-seconds: ${BUDDY_JWT_EXPIRE:28800}
  tenant:
    # 多租户开关：默认关闭=单租户（框架能力，新项目按需开启）。
    # 开启后 MyBatis-Plus 租户拦截器自动为非忽略表追加 tenant_id 过滤；表结构已由 V6 预留 tenant_id 列。
    enabled: ${BUDDY_TENANT_ENABLED:false}
    column: tenant_id
    default-tenant-id: 1
    ignore-tables:
      - sys_menu
      - flyway_schema_history
      - shedlock
  init:
    # 首次启动时自动创建的管理员账号；已存在同名账号则跳过
    admin-username: ${BUDDY_ADMIN_USERNAME:admin}
    admin-password: ${BUDDY_ADMIN_PASSWORD:Admin@123456}
  file:
    # 本地存储根目录（切换对象存储时只需替换 StorageService 实现）
    path: ${BUDDY_FILE_PATH:./uploads}
    max-size: ${BUDDY_FILE_MAX_SIZE:20971520}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - txt
      - csv
      - zip
  # ========== C 端会员（member 域）=========
  # 密钥与后台完全分离（缺失或过短时 MemberTokens 直接使启动失败，不给默认值）：
  # 共用密钥时两类令牌在密码学上不可区分，“串域”只能靠路径判断兜，新接口挂错路径就越权。
  # 约束：串域必须 401而不是 403（在分派阶段就被拒，而不是进入后台权限判定）。
  member:
    jwt-secret: ${BUDDY_MEMBER_JWT_SECRET:}
    access-token-seconds: 7200
    refresh-token-days: 30
    # 手机号/身份证只存 HMAC 摘要（供唯一不等值查询）与密文（供业务读取），不存明文
    phone-pepper: ${BUDDY_MEMBER_PHONE_PEPPER:}
    # 无真实实名通道（外部硬约束）：开发/CI 下自动通过；生产必须置 false 并走后台审核
    mock-realname-auto-approve: ${BUDDY_MEMBER_MOCK_REALNAME:false}
    # MOCK 短信通道下把验证码随响应返回以便联调；接真实通道后必须置 false（否则等于短信作废）
    mock-sms-echo-code: ${BUDDY_MEMBER_SMS_ECHO:false}

  # ========== 设备接入层（framework/iot）==========
  # 本地/CI 用嵌入式 Vert.x MQTT Broker（无 Docker 也能实证）；生产可前置 EMQX（mode=client），协议不变。
  #
  # 选型记录：一度用 Moquette 0.17，但它对 MQTT 5 CONNECT 回的 CONNACK 无法被标准 v5 客户端解码，
  # 已换为 Vert.x MQTT Server（由 IotTransportTest 跑绿验收）。
  # 测试档统一关闭（application-test.yml），避免并发测试抢端口造成不可复现的红。
  iot:
    enabled: ${BUDDY_IOT_ENABLED:true}
    mode: ${BUDDY_IOT_MODE:embedded}
    host: ${BUDDY_IOT_HOST:127.0.0.1}
    port: ${BUDDY_IOT_PORT:1883}
    node-id: ${BUDDY_IOT_NODE_ID:node-1}
    # 设备主密钥：经 SHA-256 推导为 AES-256 密钥，长度不限但必须高强度；dev 固定值仅便于本地联调
    device-secret-key: ${BUDDY_IOT_DEVICE_SECRET_KEY:dev-only-iot-device-master-key-change-me}
    # 云侧回连自身 Broker 的内部口令；缺失时云侧接入直接失败（不留默认后门）
    internal-secret: ${BUDDY_IOT_INTERNAL_SECRET:dev-only-iot-internal-secret}

# ========== 接口文档 ==========
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ========== Actuator ==========
management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点：env/heapdump 会泄露配置与内存数据，默认不开放
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  # 强制日志输出 UTF-8：JVM 在 GBK 平台默认按 GBK 写 stdout，会让 backend.log 中文乱码
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.lrs.buddy: debug
