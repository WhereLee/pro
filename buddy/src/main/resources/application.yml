server:
  port: 8200
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: buddy
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    throw-exception-if-no-handler-found: true
  task:
    scheduling:
      # 定时任务线程池：指标采集需要短暂 sleep 做两次 CPU 采样，
      # 单线程的话会阻塞其它定时任务（如 SSE 心跳）
      pool:
        size: 5
      thread-name-prefix: buddy-sched-
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 256
      thread-name-prefix: buddy-async-

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lrs.buddy.modules.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 打印 SQL 便于开发期排查，生产由 application-prod.yml 关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ========== 框架自定义配置 ==========
buddy:
  jwt:
    # HS256 要求密钥不少于 32 字节；生产环境务必替换并通过环境变量注入
    secret: ${BUDDY_JWT_SECRET:buddy-framework-default-secret-key-please-change-me-32bytes}
    # 令牌有效期，默认 8 小时
    expire-seconds: ${BUDDY_JWT_EXPIRE:28800}
  init:
    # 首次启动时自动创建的管理员账号；已存在同名账号则跳过
    admin-username: ${BUDDY_ADMIN_USERNAME:admin}
    admin-password: ${BUDDY_ADMIN_PASSWORD:Admin@123456}
  file:
    # 本地存储根目录（切换对象存储时只需替换 StorageService 实现）
    path: ${BUDDY_FILE_PATH:./uploads}
    max-size: ${BUDDY_FILE_MAX_SIZE:20971520}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - txt
      - csv
      - zip

# ========== 接口文档 ==========
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ========== Actuator ==========
management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点：env/heapdump 会泄露配置与内存数据，默认不开放
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  # 强制日志输出 UTF-8：JVM 在 GBK 平台默认按 GBK 写 stdout，会让 backend.log 中文乱码
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.lrs.buddy: debug
