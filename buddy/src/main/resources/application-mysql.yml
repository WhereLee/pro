spring:
  # ---------------- 数据源：MySQL ----------------
  # 使用方式：--spring.profiles.active=mysql
  # 首次启动由 Flyway 自动建表+种子（db/migration）；无需手工执行 SQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${BUDDY_DB_HOST:localhost}:${BUDDY_DB_PORT:3306}/${BUDDY_DB_NAME:buddy}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${BUDDY_DB_USER:root}
    password: ${BUDDY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 建表/种子由 Flyway 负责（db/migration）。注意：迁移脚本为兼容 H2 省略了 CHARSET，
  # MySQL 库须显式建为 utf8mb4，例如：
  #   CREATE DATABASE buddy CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;

  data:
    redis:
      host: ${BUDDY_REDIS_HOST:localhost}
      port: ${BUDDY_REDIS_PORT:6379}
      database: 0
