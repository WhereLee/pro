spring:
  # ---------------- 测试数据源：H2 内存库 ----------------
  # 与 dev 同构（MODE=MySQL + schema/data 自动导入），但独立命名，避免与开发实例混淆。
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:buddytest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ''
  # 测试库初始化由 Flyway 负责（application.yml 的 spring.flyway + db/migration，UTF-8）。
  # ---------------- Redis（@RepeatSubmit / 在线台账用；CI service 与本地均在 6379） ----------------
  data:
    redis:
      host: ${BUDDY_REDIS_HOST:127.0.0.1}
      port: ${BUDDY_REDIS_PORT:6379}
      database: 0
      timeout: 5s

# 关掉 MyBatis SQL 打印（application.yml 里 dev 用 StdOutImpl，测试噪音大）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 关闭升降杆样例的心跳调度：测试里手动驱动引擎保证确定性，不让 @Scheduled 每 5s 干扰
barrier:
  scheduler:
    enabled: false

# 设备接入层默认关闭：Broker 会占 1883 端口，并发跑多测试类时端口冲突会变成不可复现的随机红。
# 需要真实 Broker 的用例自己开（IotTransportTest 用独立随机端口 + 显式 enabled=true）。
buddy:
  # C 端域：测试固定密钥（与后台不同），实名与验证码走 mock 开关以便跑完全链路
  member:
    jwt-secret: test-only-member-jwt-secret-key-32bytes-min!!
    phone-pepper: test-only-phone-pepper-32bytes-minimum-len!!
    mock-realname-auto-approve: true
    mock-sms-echo-code: true
  iot:
    enabled: false

logging:
  level:
    com.lrs.buddy: info
    org.quartz: warn
    org.springframework.test: warn
