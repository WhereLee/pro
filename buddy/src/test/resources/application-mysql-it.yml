spring:
  # MySQL 一致性集成测试专用 profile：直连本地/CI 的真实 MySQL（默认 root/root、库名 buddy）。
  # 用于验证 utf8mb4 中文种子导入 + MyBatis 自定义 SQL 在真 MySQL 方言下工作，
  # 与默认 H2 测试互补；这类用例需外部 MySQL，故 @Tag("mysql") 由 surefire 默认排除。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${BUDDY_DB_HOST:127.0.0.1}:${BUDDY_DB_PORT:3306}/${BUDDY_DB_NAME:buddy_it}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${BUDDY_DB_USER:root}
    password: ${BUDDY_DB_PASSWORD:root}
  # 由 Flyway 对专用测试库 buddy_it 建表+种子（db/migration）；库不存在会自动创建、迁移可重放。
  data:
    redis:
      host: ${BUDDY_REDIS_HOST:127.0.0.1}
      port: ${BUDDY_REDIS_PORT:6379}
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# C 端身份域的两个密钥在真库 profile 下也必须给：MemberTokens / MemberAuthService 是
# “缺失即拒绝启动”（故意的），所以任何一个新 profile 漏配都会让整个上下文起不来。
buddy:
  member:
    jwt-secret: mysql-it-member-jwt-secret-32bytes-min!!
    phone-pepper: mysql-it-member-phone-pepper-32bytes-min!!!
    mock-realname-auto-approve: true
    mock-sms-echo-code: true

logging:
  level:
    com.lrs.buddy: warn
